name: Palomar full mechanical preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - name: Generate a valid preflight request identifier
        id: request
        run: python3 -c 'import secrets; print("request_id=" + secrets.token_hex(6))' >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ needs.prepare.outputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
