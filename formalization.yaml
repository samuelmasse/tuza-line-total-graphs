# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: "Tuza's conjecture for line and total graphs"
  description: >-
    Formalization in progress of the inequality tau <= 2 nu for line graphs
    and total graphs of finite simple roots, with a sharp line-graph factor
    and the exact equality tau = nu = 5n/2 for cubic triangle-free total roots.
    The two universal inequalities and cubic equality are not yet implemented.
    The current development proves supporting lemmas and the line-graph
    sharpness witness and is not ready for registration.
  authors: ["Samuel Massé"]
  responsible_maintainers: ["Samuel Massé"]
  license: MIT
classification:
  arxiv: [math.CO]
  msc2020: [05C35, 05C70]
sources:
  - title: "Tuza's conjecture for line and total graphs"
    authors: ["Samuel Massé"]
    id: paper/main.tex
    type: paper
    location: Theorems 1.1 and 1.2; Corollary 1.3; line-graph sharpness
    relationship: formalizes
    note: >-
      Unpublished manuscript dated 7 September 2026, included in this repository.
      Formalization is incomplete. See docs/provenance.md for source hashes.
  - title: "Sur quelques invariants classiques et nouveaux des hypergraphes"
    authors: ["Andrea Munaro"]
    id: https://andreamunaro.github.io/munaro-thesis.pdf
    type: book
    location: Theorem 3.3.2 and Corollary 3.3.3
    relationship: background
    note: Classical clique-packing construction attributed to Sebő and prior triangle-free-root line-graph result.
related_formalizations:
  - id: https://github.com/samuelmasse/vmath
    relationship: builds-on
    note: Adapts VMath/Tuza/Basic.lean definitions; no completed line/total proof is imported.
status:
  scope: "Supporting formalization and sharpness witness; two universal inequalities and cubic equality remain open."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: Tuza.lineGraph_factor_sharp
      file: Tuza/SmallGraphs.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
automation:
  methods:
    - method: agent
      models: ["GPT-6 Astra"]
      framework: Codex
      tool_setup: Lean 4, Mathlib, GitHub CLI, local proof development and primary-source research.
  notes: >-
    GPT-6 Astra contributed to mathematical proof development, internal checks,
    literature search, exposition and formalization. No missing proof is
    introduced as an axiom and no native_decide premise is permitted.
fidelity:
  divergences: >-
    The formal targets retain finite simple roots, empty and disconnected cases,
    ordinary edge packings and covers. Cubic equality is stated using doubled
    natural-number counts to avoid truncating 5n/2. The two universal inequality
    proofs and the cubic equality proof remain absent.
review:
  status: unchecked
  notes: >-
    The manuscript has an internal AI-assisted audit in vmath. This does not
    constitute independent review of the formal translation. No Comparator,
    NanoDa, Palomar review, human expert review or novelty certification is claimed.
alignment:
  namespace: Tuza
  statements:
    - source: Theorem 1.1
      lean: Tuza.lineGraph_satisfiesTuza
      module: Solution
      status: not-formalized
    - source: Theorem 1.2
      lean: Tuza.totalGraph_satisfiesTuza
      module: Solution
      status: not-formalized
    - source: Sharpness in the proof of Theorem 1.1
      lean: Tuza.lineGraph_factor_sharp
      module: Solution
      status: proved
    - source: Corollary 1.3
      lean: Tuza.cubic_triangleFree_total_parameters
      module: Solution
      status: not-formalized
acknowledgements: "OpenAI's GPT-6 Astra; the Lean and Mathlib communities."
